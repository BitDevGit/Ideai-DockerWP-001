# Vanilla WordPress Test Configuration
# Simple setup for testing wp-admin redirects

server {
    listen 80;
    server_name vanilla.localwp localhost;
    
    root /var/www/html;
    index index.php;

    # Logging
    access_log /var/log/nginx/vanilla-access.log;
    error_log /var/log/nginx/vanilla-error.log;

    # Increase buffer sizes for large requests
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress-vanilla:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        
        # Increase timeouts
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }

    # Deny access to wp-config.php
    location ~ wp-config.php {
        deny all;
    }
}

